@if (isSwitchable()) {
  <kui-field class="version-switcher__field">
    <input
      kuiSelect
      aria-label="Documentation version"
      [value]="current().id"
      [kuiLabelFn]="versionLabel"
      [clearable]="false"
      (valueChange)="select($event)"
    />
    <kui-dropdown>
      @for (version of versions(); track version.id) {
        <div kuiOption [value]="version.id">{{ version.label }}</div>
      }
    </kui-dropdown>
  </kui-field>
}
