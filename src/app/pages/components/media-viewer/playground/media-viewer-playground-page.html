<article class="media-viewer-playground-page">
  <div class="media-viewer-playground-page__header">
    <h1>Media Viewer &mdash; Playground</h1>
  </div>

  <app-api-playground
    #playground="appApiPlayground"
    previewLabel="Media viewer playground"
    [controls]="playgroundControls"
    [snippet]="buildPlaygroundSnippet"
  >
    <button kuiButton type="button" (click)="open(playground.values())">Open viewer</button>
  </app-api-playground>

  <app-playground-event-log [log]="eventLog" label="Media viewer events" />

  <app-api-table label="Media Viewer API" [rows]="apiRows" />
  <p class="media-viewer-playground-page__note">{{ apiDescription }}</p>
</article>
