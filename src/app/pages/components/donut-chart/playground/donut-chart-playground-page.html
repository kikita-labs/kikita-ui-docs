<article class="donut-chart-playground-page">
  <div class="donut-chart-playground-page__header">
    <h1>Donut Chart &mdash; Playground</h1>
  </div>

  <app-api-playground
    #playground="appApiPlayground"
    previewLabel="Donut Chart playground"
    [controls]="playgroundControls"
    [snippet]="buildPlaygroundSnippet"
  >
    <kui-donut-chart
      [ariaLabel]="ariaLabelOf(playground.values())"
      [slices]="dataOf(playground.values())"
      [patterns]="patternsOf(playground.values())"
      [size]="sizeOf(playground.values())"
      [loading]="loadingOf(playground.values())"
      [legend]="legendOf(playground.values())"
      [valueFormat]="valueFormatOf(playground.values())"
      [tooltip]="tooltipOf(playground.values())"
      [messages]="messagesOf(playground.values())"
    />
  </app-api-playground>

  <app-api-table label="Donut Chart API" [rows]="apiRows" />
  <p class="donut-chart-playground-page__note">{{ apiDescription }}</p>
</article>
