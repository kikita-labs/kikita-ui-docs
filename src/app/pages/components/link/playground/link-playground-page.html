<article class="link-playground-page">
  <div class="link-playground-page__header">
    <h1>Link &mdash; Playground</h1>
  </div>

  <app-api-playground
    #playground="appApiPlayground"
    previewLabel="Link playground"
    [controls]="playgroundControls"
    [snippet]="buildPlaygroundSnippet"
  >
    @if (isAnchor(playground.values())) {
      <a
        kuiLink
        href="#docs"
        [tone]="toneOf(playground.values())"
        [underline]="underlineOf(playground.values())"
        [variant]="variantOf(playground.values())"
        [iconStart]="iconStartOf(playground.values())"
        [iconEnd]="iconEndOf(playground.values())"
        [target]="targetOf(playground.values())"
        [external]="externalOf(playground.values())"
        [disabled]="disabledOf(playground.values())"
        >{{ textOf(playground.values()) }}</a
      >
    } @else {
      <button
        kuiLink
        type="button"
        [tone]="toneOf(playground.values())"
        [underline]="underlineOf(playground.values())"
        [variant]="variantOf(playground.values())"
        [iconStart]="iconStartOf(playground.values())"
        [iconEnd]="iconEndOf(playground.values())"
        [external]="externalOf(playground.values())"
        [disabled]="disabledOf(playground.values())"
      >
        {{ textOf(playground.values()) }}
      </button>
    }
  </app-api-playground>

  <app-api-table label="Link API" [rows]="apiRows" />
  <p class="link-playground-page__note">{{ apiDescription }}</p>
</article>
