<div class="time-picker-example">
  <kui-field label="Meeting time" hint="Type a time or choose from the columns.">

    <kui-dropdown panelRole="dialog" panelWidth="auto" maxHeight="280px">
      <kui-time-picker-panel />
    </kui-dropdown>
  </kui-field>
</div>
