<article class="avatar-playground-page">
  <div class="avatar-playground-page__header">
    <h1>Avatar &mdash; Playground</h1>
  </div>

  <app-api-playground
    #playground="appApiPlayground"
    previewLabel="Avatar playground"
    [controls]="playgroundControls"
    [snippet]="buildPlaygroundSnippet"
  >
    <kui-avatar
      [src]="srcOf(playground.values())"
      [name]="nameOf(playground.values())"
      [initials]="initialsOf(playground.values())"
      [alt]="altOf(playground.values())"
      [paletteIndex]="paletteIndexOf(playground.values())"
      [size]="sizeOf(playground.values())"
      [shape]="shapeOf(playground.values())"
      [status]="statusOf(playground.values())"
      [loading]="loadingOf(playground.values())"
    />
  </app-api-playground>

  <h2 class="avatar-playground-page__subheading">Avatar group</h2>

  <app-api-playground
    #groupPlayground="appApiPlayground"
    previewLabel="Avatar group playground"
    [controls]="groupControls"
    [snippet]="buildGroupSnippet"
  >
    <kui-avatar-group
      [avatars]="membersOf(groupPlayground.values())"
      [max]="groupMaxOf(groupPlayground.values())"
      [size]="groupSizeOf(groupPlayground.values())"
      [shape]="groupShapeOf(groupPlayground.values())"
      [label]="groupLabelOf(groupPlayground.values())"
    />
  </app-api-playground>

  <app-api-table label="Avatar API" [rows]="apiRows" />
  <p class="avatar-playground-page__note">{{ apiDescription }}</p>
</article>
