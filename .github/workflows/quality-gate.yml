name: Quality gate

# Reusable gate shared by deploy.yml and archive-docs.yml. Static checks, the production build and
# the browser suites run as parallel jobs; each browser project is its own job.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-workspace

      - run: pnpm run format:check

      - run: pnpm run lint

      - run: pnpm run test

      - run: pnpm run check:boundaries

      - run: pnpm run check:generated

      - run: pnpm run check:inventory

      - run: pnpm run check:package-consumer

      - run: pnpm run check:migration-debt

      - run: pnpm run check:site-config

      - run: pnpm run check:agent-surface

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-workspace

      - run: pnpm run build

      - run: pnpm run check:performance

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/kikita-ui-docs
          retention-days: 1

  browser:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        project: [e2e, a11y, responsive, visual]
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-workspace

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/kikita-ui-docs

      - name: Resolve Playwright version
        id: playwright
        run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - run: pnpm exec playwright install --with-deps chromium

      - run: pnpm exec playwright test --project=${{ matrix.project }}

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-${{ matrix.project }}
          path: |
            playwright-report
            test-results
          retention-days: 7
