name: Publish @kikita-labs/ui-mcp

# Publishes the MCP package whenever a version that is not on npm yet reaches main or a release
# branch. A merge without a version bump is a no-op, and `pnpm check:mcp-version` fails the
# quality gate when the data changed without a bump, so changing the data always means a bump.
#
# Trusted Publishing: npm exchanges this workflow's OIDC token for a
# short-lived publish credential. No NPM_TOKEN secret involved -- the trust
# relationship is configured on npmjs.com under the package's
# Settings > Trusted Publisher (GitHub Actions, org kikita-labs, repo
# kikita-ui-docs, workflow filename publish-mcp.yml). Keep the file name.
on:
  push:
    branches:
      - main
      - 'release/*.x'
    paths:
      - 'mcp/**'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: publish-mcp-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read the version and check whether npm already has it
        id: version
        run: |
          version=$(node -p "require('./mcp/package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          published=$(curl -fsS "https://registry.npmjs.org/@kikita-labs%2Fui-mcp" | node -e "
            let s = ''; process.stdin.on('data', (d) => (s += d)).on('end', () => {
              console.log(JSON.parse(s).versions?.['$version'] ? 'true' : 'false');
            });")
          echo "published=$published" >> "$GITHUB_OUTPUT"
          echo "MCP $version already published: $published"

      - uses: pnpm/action-setup@v4
        if: steps.version.outputs.published == 'false'

      - uses: actions/setup-node@v4
        if: steps.version.outputs.published == 'false'
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
          cache: pnpm

      # OIDC trusted publishing needs npm CLI >= 11.5.1.
      - run: npm install -g npm@latest
        if: steps.version.outputs.published == 'false'

      - run: pnpm install --frozen-lockfile
        if: steps.version.outputs.published == 'false'

      # mcp/generated/kikita-agent-data.json is committed, not regenerated here, so a publish is
      # exactly what was reviewed. Regenerate it locally (pnpm generate:agent-surface) and bump
      # the version in the same commit.
      - run: npm run check:mcp
        if: steps.version.outputs.published == 'false'

      # Publishing without --tag moves `latest`. A release of an older major (for example a 1.x
      # fix after 2.0.0 shipped) must not take `latest` from the newest major, so it is published
      # as `latest-<major>`; prereleases go to `next`. npm rejects tag names that begin with a
      # number or `v`, so `v1` would not be a valid tag.
      - name: Resolve the npm dist-tag
        if: steps.version.outputs.published == 'false'
        id: dist-tag
        run: |
          version=${{ steps.version.outputs.version }}
          major=${version%%.*}
          latest=$(npm view @kikita-labs/ui-mcp dist-tags.latest --@kikita-labs:registry=https://registry.npmjs.org/ || true)
          latest_major=${latest%%.*}
          if [[ "$version" == *-* ]]; then
            tag=next
          elif [ -n "$latest_major" ] && [ "$major" -lt "$latest_major" ]; then
            tag="latest-$major"
          else
            tag=latest
          fi
          echo "Publishing $version with dist-tag $tag (registry latest: ${latest:-none})."
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - run: npm publish ./mcp --access public --tag "${{ steps.dist-tag.outputs.tag }}" --@kikita-labs:registry=https://registry.npmjs.org/
        if: steps.version.outputs.published == 'false'

      # A tag only records what was released; it does not trigger anything.
      - name: Tag the release
        if: steps.version.outputs.published == 'false'
        run: |
          git tag "mcp-v${{ steps.version.outputs.version }}"
          git push origin "mcp-v${{ steps.version.outputs.version }}"
