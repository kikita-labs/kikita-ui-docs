name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One Pages deployment at a time. Archive workflows dispatch this workflow, so a deployment that
# is already running finishes before the next one starts and never publishes a stale site over a
# newer one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/quality-gate

      # The gate above builds for the site root so the browser suites can serve it. The published
      # build must use the base href this branch is published under.
      - name: Build for the published base href
        run: pnpm exec ng build --base-href "$(node tools/docs-site.mjs base-href)"

      - run: pnpm run check:versioned-output

      - name: Download archived documentation versions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .tmp/archives
          for id in $(node tools/docs-site.mjs archived-ids); do
            mkdir -p ".tmp/archives/$id"
            gh release download "docs-$id" --pattern "docs-$id.tar.gz" --dir .tmp --clobber
            tar -xzf ".tmp/docs-$id.tar.gz" -C ".tmp/archives/$id"
          done

      - name: Assemble the site
        run: pnpm run assemble:site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
